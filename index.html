<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box;margin:0}body{font-family:system-ui,sans-serif;background:#f6f6f7;color:#111;padding:8vh 6%}

.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;max-width:960px}

.a{background:#fff;color:#111;border:1px solid #e5e5e5}.b{background:#000;color:#fff}.c{background:#030403;color:#39ff14;border:1px solid #39ff14;box-shadow:0 0 24px rgba(57,255,20,.35)}
</style></head><body>
<h1>Web Development Activity</h1><p>Three case studies: travel agency, fitness center and gaming community.</p>
<div class="g"><a class="a" href="travel/"><b>Travel Agency</b><span>Clean white design</span></a>
<a class="b" href="fitness/"><b>Fitness Center</b><span>Bold black design</span></a>
<a class="c" href="gaming/"><b>Gaming and Esports</b><span>Black and neon green</span></a></div>
</body></html>
